name: iOS Build Unsigned IPA

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project HeartFloat.xcodeproj \
            -scheme HeartFloat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HeartFloat.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            ENABLE_BITCODE=NO \
            SKIP_INSTALL=NO \
            DEAD_CODE_STRIPPING=YES \
            | xcpretty

      - name: Verify app bundle
        run: |
          APP_PATH="build/HeartFloat.xcarchive/Products/Applications/HeartFloat.app"
          BINARY="$APP_PATH/HeartFloat"

          if [ ! -f "$BINARY" ]; then
            echo "::error::App binary not found"
            exit 1
          fi

          echo "=== App bundle contents ==="
          ls -la "$APP_PATH/"

          BINARY_SIZE=$(stat -f%z "$BINARY")
          echo "App binary size: $BINARY_SIZE bytes"

          if [ "$BINARY_SIZE" -lt 10000 ]; then
            echo "::error::App binary too small ($BINARY_SIZE bytes)"
            exit 1
          fi

          echo "=== App bundle size ==="
          du -sh "$APP_PATH"

      - name: Package IPA manually
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          APP_SRC="build/HeartFloat.xcarchive/Products/Applications/HeartFloat.app"
          cp -R "$APP_SRC" build/ipa/Payload/

          echo "Creating IPA..."
          cd build/ipa
          zip -r ../HeartFloat-unsigned.ipa Payload -x "*.DS_Store"
          cd ../..

          echo "IPA created:"
          ls -lh build/HeartFloat-unsigned.ipa

      - name: Final artifact preparation
        run: |
          mv build/HeartFloat-unsigned.ipa build/HeartFloat.ipa
          echo "Final IPA:"
          ls -lh build/HeartFloat.ipa
          echo -e "\n=== IPA contents ==="
          unzip -l build/HeartFloat.ipa

      # 打 tag 推送时（如 2.0），把 IPA 发布到 GitHub Releases
      - name: Rename IPA for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp build/HeartFloat.ipa "build/HeartFloat-${GITHUB_REF_NAME}.ipa"

      - name: Publish IPA to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/HeartFloat-${{ github.ref_name }}.ipa
          generate_release_notes: true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeartFloat-unsigned-ipa
          path: build/HeartFloat.ipa
          retention-days: 30
